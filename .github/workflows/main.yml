name: Griffle-Guard CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: 🐳 Build Docker Image
        run: docker build -t griffle-guard-sentry .
