name: Griffle-Guard CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ✅ Compile Python
        run: python -m compileall -q guard.py lambda_function.py repo_agent tests

      - name: 🧪 Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: 🐳 Build Docker Image
        run: docker build -t griffle-guard-sentry .
